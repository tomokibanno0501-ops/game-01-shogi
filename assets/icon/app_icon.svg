<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="45%" stop-color="#FFC24D"/>
      <stop offset="100%" stop-color="#FF8A5B"/>
    </radialGradient>
    <linearGradient id="piece" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6E0"/>
      <stop offset="55%" stop-color="#FFDD9B"/>
      <stop offset="100%" stop-color="#FDBD6B"/>
    </linearGradient>
    <linearGradient id="pieceShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background fills entire square -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- soft decorative circles -->
  <circle cx="90" cy="110" r="34" fill="#FF6F91" opacity="0.55"/>
  <circle cx="430" cy="90" r="24" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="60" cy="410" r="22" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="450" cy="420" r="30" fill="#FF6F91" opacity="0.5"/>

  <!-- sparkle stars -->
  <g fill="#FFFFFF" opacity="0.85">
    <path d="M120 60 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
    <path d="M400 150 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z"/>
    <path d="M420 320 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z"/>
  </g>

  <!-- shogi piece silhouette (motif of Osho / King piece) -->
  <g stroke="#B5651D" stroke-width="12" stroke-linejoin="round">
    <polygon points="256,84 330,160 360,416 336,450 176,450 152,416 182,160"
             fill="url(#piece)"/>
  </g>
  <polygon points="256,84 330,160 336,196 176,196 182,160" fill="url(#pieceShine)"/>

  <!-- cute face -->
  <g>
    <!-- eyes -->
    <circle cx="212" cy="270" r="20" fill="#4A3221"/>
    <circle cx="300" cy="270" r="20" fill="#4A3221"/>
    <circle cx="218" cy="263" r="6" fill="#FFFFFF"/>
    <circle cx="306" cy="263" r="6" fill="#FFFFFF"/>

    <!-- blush -->
    <ellipse cx="182" cy="308" rx="18" ry="11" fill="#FF8FA3" opacity="0.75"/>
    <ellipse cx="330" cy="308" rx="18" ry="11" fill="#FF8FA3" opacity="0.75"/>

    <!-- smile -->
    <path d="M228 312 C240 332 272 332 284 312" fill="none" stroke="#8B4B23" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- small heart accent at the peak -->
  <path d="M256 118 c-6 -8 -20 -6 -20 4 c0 9 12 16 20 22 c8 -6 20 -13 20 -22 c0 -10 -14 -12 -20 -4 z"
        fill="#FF6F91" opacity="0.9"/>
</svg>
